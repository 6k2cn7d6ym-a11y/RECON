<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#060809">
<title>RECON</title>
<link href="https://fonts.googleapis.com/css2?family=Syne+Mono&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060809; --bg1:#0c1015; --bg2:#111820; --bg3:#18222e;
  --b:#1c2a38; --b2:#253646;
  --t:#dde8f0; --t2:#5a7a95; --t3:#2d4a60;
  --g:#00f07a; --g2:#00ff88; --gd:#00a050;
  --r:#ff2d4e; --a:#ffaa00; --bl:#2b9fff; --pu:#9f7aff;
  --mono:'Syne Mono',monospace; --sans:'Syne',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--t);font-family:var(--sans);overscroll-behavior:none}

/* ─── 전체 레이아웃 ─── */
.app{display:flex;flex-direction:column;height:100dvh;max-width:480px;margin:0 auto;position:relative}

/* ─── 헤더 ─── */
.hdr{display:flex;justify-content:space-between;align-items:center;padding:env(safe-area-inset-top,16px) 20px 14px;background:rgba(6,8,9,.9);backdrop-filter:blur(24px);border-bottom:1px solid var(--b);flex-shrink:0;position:relative;z-index:10}
.logo{font-family:var(--mono);font-size:20px;letter-spacing:.12em;color:var(--g)}
.logo span{color:var(--t2)}
.hdr-right{display:flex;align-items:center;gap:10px}
.clock{font-family:var(--mono);font-size:11px;color:var(--t2)}
.status-pill{display:flex;align-items:center;gap:5px;background:rgba(0,240,122,.07);border:1px solid rgba(0,240,122,.2);border-radius:20px;padding:4px 10px;font-family:var(--mono);font-size:10px;color:var(--g)}
.blink{width:5px;height:5px;border-radius:50%;background:var(--g);animation:blink 1.4s ease infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

/* ─── 탭 ─── */
.tabs{display:flex;background:var(--bg1);border-bottom:1px solid var(--b);flex-shrink:0}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px 8px;cursor:pointer;color:var(--t3);font-size:9px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;transition:color .15s;border:none;background:none;position:relative}
.tab.on{color:var(--g)}
.tab.on::after{content:'';position:absolute;bottom:0;left:20%;right:20%;height:2px;background:var(--g);border-radius:2px 2px 0 0}
.tab-icon{width:18px;height:18px}
.notif-dot{position:absolute;top:8px;right:calc(50% - 14px);width:6px;height:6px;background:var(--r);border-radius:50%;border:1.5px solid var(--bg1)}

/* ─── 스크롤 영역 ─── */
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:max(20px,env(safe-area-inset-bottom))}

/* ─── 검색 ─── */
.search-area{padding:14px 16px 8px}
.search-box{display:flex;gap:8px;align-items:center;background:var(--bg2);border:1.5px solid var(--b);border-radius:14px;padding:0 14px;height:50px;transition:border-color .2s}
.search-box:focus-within{border-color:rgba(0,240,122,.5)}
.s-prefix{font-family:var(--mono);font-size:13px;color:var(--t2);letter-spacing:.1em}
.s-input{flex:1;background:none;border:none;outline:none;font-family:var(--mono);font-size:15px;font-weight:400;color:var(--t);letter-spacing:.12em;text-transform:uppercase;caret-color:var(--g)}
.s-input::placeholder{color:var(--t3);text-transform:none;letter-spacing:0}
.scan-btn{background:var(--g);color:#000;border:none;border-radius:10px;padding:9px 14px;font-family:var(--sans);font-size:12px;font-weight:700;cursor:pointer;letter-spacing:.04em;white-space:nowrap;transition:opacity .15s;flex-shrink:0}
.scan-btn:active{opacity:.7}
.scan-btn:disabled{opacity:.3;cursor:not-allowed}

/* ─── 종목 카드 ─── */
.cards-area{padding:4px 16px 0}
.phase-label{font-family:var(--mono);font-size:9px;color:var(--t2);letter-spacing:.1em;text-transform:uppercase;margin:12px 0 8px;display:flex;align-items:center;gap:8px}
.phase-label::after{content:'';flex:1;height:1px;background:var(--b)}

.stock-card{background:var(--bg1);border:1px solid var(--b);border-radius:16px;padding:16px;margin-bottom:10px;position:relative;overflow:hidden;transition:transform .15s,border-color .2s;cursor:pointer}
.stock-card:active{transform:scale(.98)}
.stock-card.enter{border-color:rgba(0,240,122,.3)}
.stock-card.enter::before{content:'';position:absolute;inset:0 0 auto 0;height:2px;background:linear-gradient(90deg,var(--g),transparent)}
.stock-card.watch{border-color:rgba(255,170,0,.2)}
.stock-card.block{border-color:rgba(255,45,78,.2);opacity:.7}

.card-row1{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.card-ticker{font-family:var(--mono);font-size:22px;font-weight:400;color:var(--t);letter-spacing:.06em}
.card-sub{font-size:10px;color:var(--t2);margin-top:2px;font-family:var(--mono)}
.action-badge{display:flex;flex-direction:column;align-items:center;justify-content:center;width:52px;height:52px;border-radius:50%;flex-shrink:0}
.ab-enter{background:rgba(0,240,122,.1);border:1.5px solid rgba(0,240,122,.3)}
.ab-watch{background:rgba(255,170,0,.1);border:1.5px solid rgba(255,170,0,.3)}
.ab-block{background:rgba(255,45,78,.1);border:1.5px solid rgba(255,45,78,.3)}
.ab-score{font-family:var(--mono);font-size:16px;font-weight:400;line-height:1}
.ab-enter .ab-score{color:var(--g)}
.ab-watch .ab-score{color:var(--a)}
.ab-block .ab-score{color:var(--r)}
.ab-label{font-size:8px;font-weight:700;letter-spacing:.08em;margin-top:1px}
.ab-enter .ab-label{color:rgba(0,240,122,.6)}
.ab-watch .ab-label{color:rgba(255,170,0,.6)}
.ab-block .ab-label{color:rgba(255,45,78,.6)}

.card-row2{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.card-price{font-family:var(--mono);font-size:28px;color:var(--t)}
.card-gap{font-family:var(--mono);font-size:13px;font-weight:400;background:var(--g);color:#000;padding:2px 9px;border-radius:6px}
.card-gap.red{background:var(--r);color:#fff}
.card-rvol{font-family:var(--mono);font-size:11px;color:var(--t2)}

.card-tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.tag{font-size:10px;font-weight:600;padding:3px 8px;border-radius:5px;letter-spacing:.04em}
.tg{background:rgba(0,240,122,.1);color:var(--g);border:1px solid rgba(0,240,122,.15)}
.tb{background:rgba(43,159,255,.1);color:var(--bl);border:1px solid rgba(43,159,255,.15)}
.tr{background:rgba(255,45,78,.1);color:var(--r);border:1px solid rgba(255,45,78,.15)}
.ta{background:rgba(255,170,0,.1);color:var(--a);border:1px solid rgba(255,170,0,.15)}
.tp{background:rgba(159,122,255,.1);color:var(--pu);border:1px solid rgba(159,122,255,.15)}

.news-line{font-size:12px;color:var(--t2);line-height:1.5;padding-left:10px;border-left:2px solid var(--b2);margin-bottom:12px}

.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:0;background:var(--bg2);border-radius:11px;overflow:hidden}
.lv{padding:8px 6px;text-align:center;border-right:1px solid var(--b)}
.lv:last-child{border-right:none}
.lv-label{font-size:8px;color:var(--t2);letter-spacing:.06em;margin-bottom:3px;text-transform:uppercase}
.lv-val{font-family:var(--mono);font-size:13px;font-weight:400}
.lv-entry .lv-val{color:var(--bl)}
.lv-stop  .lv-val{color:var(--r)}
.lv-t1    .lv-val{color:var(--g)}
.lv-rr    .lv-val{color:var(--pu)}

.card-signals{margin-top:10px;display:flex;flex-direction:column;gap:4px}
.sig-line{display:flex;gap:6px;font-size:11px;color:var(--t);line-height:1.5}
.sig-icon{flex-shrink:0;margin-top:1px}

/* 알림 패널 */
.alert-card{background:var(--bg1);border:1px solid var(--b);border-radius:14px;padding:13px 14px;margin:0 16px 8px;animation:slideIn .25s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.alert-card.alert-enter{border-left:3px solid var(--g)}
.alert-card.alert-block{border-left:3px solid var(--r);opacity:.85}
.alert-card.alert-exit{border-left:3px solid var(--a)}
.alert-card.alert-stop{border-left:3px solid var(--r)}
.alert-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.alert-ticker{font-family:var(--mono);font-size:14px;font-weight:400;letter-spacing:.08em}
.alert-time{font-family:var(--mono);font-size:10px;color:var(--t2)}
.alert-msg{font-size:12px;color:var(--t2);line-height:1.5}
.alert-action{font-family:var(--mono);font-size:11px;font-weight:400;margin-top:3px}
.aa-enter{color:var(--g)} .aa-block{color:var(--r)} .aa-exit{color:var(--a)} .aa-stop{color:var(--r)}
.empty-state{text-align:center;padding:60px 20px;color:var(--t3);font-size:13px;line-height:2}
.es-icon{font-size:32px;margin-bottom:12px;opacity:.4}

/* 설정 */
.settings{padding:16px}
.sg-title{font-family:var(--mono);font-size:9px;color:var(--t2);letter-spacing:.1em;text-transform:uppercase;margin:16px 0 8px}
.sg-title:first-child{margin-top:0}
.sg-row{display:flex;justify-content:space-between;align-items:center;background:var(--bg1);border:1px solid var(--b);border-radius:12px;padding:13px 14px;margin-bottom:4px}
.sg-label{font-size:14px;color:var(--t)}
.sg-sub{font-size:11px;color:var(--t2);margin-top:2px}
.sg-val{font-family:var(--mono);font-size:13px;color:var(--bl);background:var(--bg2);padding:5px 11px;border-radius:7px;border:1px solid var(--b);cursor:pointer;transition:border-color .15s}
.sg-val:active{border-color:var(--bl)}
.toggle{width:44px;height:26px;background:var(--b2);border-radius:13px;position:relative;cursor:pointer;transition:background .2s;flex-shrink:0;border:none}
.toggle.on{background:var(--g)}
.toggle::after{content:'';position:absolute;width:20px;height:20px;background:#fff;border-radius:50%;top:3px;left:3px;transition:transform .2s}
.toggle.on::after{transform:translateX(18px)}
.key-input{background:var(--bg2);border:1px solid var(--b);border-radius:10px;padding:10px 12px;font-family:var(--mono);font-size:12px;color:var(--t);outline:none;width:100%;margin-top:6px;transition:border-color .2s}
.key-input:focus{border-color:var(--bl)}
.key-input::placeholder{color:var(--t3)}
.ntfy-row{display:flex;gap:8px;margin-top:6px}
.ntfy-input{flex:1;background:var(--bg2);border:1px solid var(--b);border-radius:10px;padding:10px 12px;font-family:var(--mono);font-size:12px;color:var(--t);outline:none;transition:border-color .2s}
.ntfy-input:focus{border-color:var(--bl)}
.ntfy-input::placeholder{color:var(--t3)}
.test-btn{background:var(--bl);color:#000;border:none;border-radius:10px;padding:10px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--sans);white-space:nowrap}
.test-btn:active{opacity:.7}
.ntfy-status{font-family:var(--mono);font-size:11px;color:var(--t2);margin-top:6px;min-height:16px}

/* 분석 중 로딩 */
.analyzing-card{background:var(--bg1);border:1px solid rgba(0,240,122,.2);border-radius:16px;padding:20px 16px;margin:4px 16px 10px;display:flex;align-items:center;gap:14px}
.analyzing-spinner{width:32px;height:32px;border-radius:50%;border:2px solid var(--b2);border-top-color:var(--g);animation:spin .8s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.analyzing-text{font-size:13px;color:var(--t2);line-height:1.6}
.analyzing-ticker{font-family:var(--mono);font-size:16px;color:var(--t);font-weight:400;letter-spacing:.1em}

/* 모의 PnL 바 */
.pnl-bar{background:var(--bg2);border-radius:10px;padding:10px 14px;margin:10px 16px;display:flex;justify-content:space-between;align-items:center}
.pnl-label{font-size:11px;color:var(--t2)}
.pnl-val{font-family:var(--mono);font-size:16px;font-weight:400}
.pnl-pos{color:var(--g)} .pnl-neg{color:var(--r)} .pnl-zero{color:var(--t2)}
</style>
</head>
<body>
<div class="app">

<!-- 헤더 -->
<div class="hdr">
  <div class="logo">RECON<span>.</span></div>
  <div class="hdr-right">
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:1px"><div class="clock" id="clockET">--:-- ET</div><div class="clock" id="clockKST" style="color:var(--t3);font-size:10px">--:-- KST</div></div>
    <div class="status-pill"><div class="blink"></div><span id="phaseLabel">대기</span></div>
  </div>
</div>

<!-- 탭 -->
<div class="tabs">
  <button class="tab on" onclick="switchTab('scan',this)" id="tabScan">
    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    스캔
  </button>
  <button class="tab" onclick="switchTab('alerts',this)" id="tabAlerts" style="position:relative">
    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
    알림
    <div class="notif-dot" id="notifDot" style="display:none"></div>
  </button>
  <button class="tab" onclick="switchTab('settings',this)">
    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    설정
  </button>
</div>

<!-- ① 스캔 탭 -->
<div class="scroll" id="page-scan">
  <div class="search-area">
    <div class="search-box">
      <span class="s-prefix">$</span>
      <input class="s-input" id="tickerInput" placeholder="SOUN MVIS RGTI (띄어쓰기로 여러개)" maxlength="60" autocomplete="off" autocorrect="off" spellcheck="false" style="letter-spacing:.05em">
      <button class="scan-btn" id="scanBtn" onclick="runScan()">분석</button>
    </div>
  </div>

  <div id="statsBar" style="display:flex;justify-content:space-between;align-items:center;padding:0 16px 6px;font-family:var(--mono);font-size:10px;color:var(--t2)">
    <span id="statsText">오늘 분석 0개</span>
    <div style="display:flex;gap:8px">
      <button onclick="setSortMode('score')" id="btnScore" style="background:rgba(0,240,122,.12);color:var(--g);border:1px solid rgba(0,240,122,.2);border-radius:5px;padding:3px 8px;font-family:var(--mono);font-size:10px;cursor:pointer">점수순</button>
      <button onclick="setSortMode('time')" id="btnTime" style="background:none;color:var(--t3);border:1px solid var(--b);border-radius:5px;padding:3px 8px;font-family:var(--mono);font-size:10px;cursor:pointer">최신순</button>
      <button onclick="clearToday()" style="background:none;color:var(--t3);border:1px solid var(--b);border-radius:5px;padding:3px 8px;font-family:var(--mono);font-size:10px;cursor:pointer">오늘삭제</button>
    </div>
  </div>
  <div id="analyzeArea"></div>
  <div id="pnlBar"></div>

  <div class="cards-area">
    <div class="phase-label" id="phaseSection">오늘의 스캔 결과</div>
    <div id="cardsList"></div>
  </div>
</div>

<!-- ② 알림 탭 -->
<div class="scroll" id="page-alerts" style="display:none">
  <div style="padding:14px 16px 8px;display:flex;justify-content:space-between;align-items:center">
    <div style="font-family:var(--mono);font-size:9px;color:var(--t2);letter-spacing:.1em;text-transform:uppercase">알림 내역</div>
    <button onclick="clearAlerts()" style="font-family:var(--mono);font-size:10px;color:var(--t3);background:none;border:none;cursor:pointer">전체 삭제</button>
  </div>
  <div id="alertsList"></div>
</div>

<!-- ③ 설정 탭 -->
<div class="scroll" id="page-settings" style="display:none">
<div class="settings">
  <div class="sg-title">Claude API</div>
  <div class="sg-row" style="flex-direction:column;align-items:flex-start">
    <div><div class="sg-label">API Key</div><div class="sg-sub">신호 분석에 필요. console.anthropic.com</div></div>
    <input class="key-input" type="password" id="apiKey" placeholder="sk-ant-..." oninput="save('apexKey',this.value)">
  </div>

  <div class="sg-title">폰 알림 (ntfy)</div>
  <div class="sg-row" style="flex-direction:column;align-items:flex-start">
    <div><div class="sg-label">ntfy 채널</div><div class="sg-sub">앱스토어에서 ntfy 설치 후 구독</div></div>
    <div class="ntfy-row">
      <input class="ntfy-input" type="text" id="ntfyCh" placeholder="내채널명-1234" oninput="save('ntfyCh',this.value)">
      <button class="test-btn" onclick="testNtfy()">테스트</button>
    </div>
    <div class="ntfy-status" id="ntfyStatus"></div>
  </div>

  <div class="sg-title">스캔 기준</div>
  <div class="sg-row">
    <div><div class="sg-label">최소 갭업</div><div class="sg-sub">이 이하 종목 제외</div></div>
    <div class="sg-val" id="minGap" onclick="cycle('minGap',['15%','20%','30%','50%'])">20%</div>
  </div>
  <div class="sg-row">
    <div><div class="sg-label">최대 Float</div><div class="sg-sub">이 이상 Float 제외</div></div>
    <div class="sg-val" id="maxFloat" onclick="cycle('maxFloat',['5M','10M','20M'])">20M</div>
  </div>
  <div class="sg-row">
    <div><div class="sg-label">최소 점수</div><div class="sg-sub">알림 발송 기준</div></div>
    <div class="sg-val" id="minScore" onclick="cycle('minScore',['60','65','70','75','80'])">70</div>
  </div>

  <div class="sg-title">알림</div>
  <div class="sg-row">
    <div><div class="sg-label">알림음</div><div class="sg-sub">신호 발생 시 소리</div></div>
    <button class="toggle on" id="tgSound" onclick="this.classList.toggle('on')"></button>
  </div>
  <div class="sg-row">
    <div><div class="sg-label">덤프 경고</div><div class="sg-sub">BLOCK 신호 알림</div></div>
    <button class="toggle on" id="tgBlock" onclick="this.classList.toggle('on')"></button>
  </div>

  <div class="sg-title">앱</div>
  <div class="sg-row"><div class="sg-label">RECON Scanner</div><div style="font-family:var(--mono);font-size:11px;color:var(--t2)">v1.0 · 테스트 모드</div></div>
  <div class="sg-row" style="cursor:pointer" onclick="clearAll()"><div class="sg-label" style="color:var(--r)">모든 데이터 삭제</div></div>
</div>
</div>

</div>

<script>
// ═══ 상태 ═══
var G = {
  apiKey:  localStorage.getItem('apexKey') || '',
  ntfy:    localStorage.getItem('ntfyCh') || '',
  alerts:  JSON.parse(localStorage.getItem('apexAlerts')||'[]'),
  cards:   JSON.parse(localStorage.getItem('apexCards')||'[]'),
  mockPnl: parseFloat(localStorage.getItem('apexPnl')||'0'),
  unread:  0,
  sortMode: 'score',
};

// 초기값 로드
if(G.apiKey) document.getElementById('apiKey').value = G.apiKey;

// ═══ 탭 전환 ═══
function switchTab(id, btn){
  ['scan','alerts','settings'].forEach(p=>{
    document.getElementById('page-'+p).style.display = p===id?'':'none';
  });
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  if(id==='alerts'){ G.unread=0; updateBadge(); renderAlerts(); }
}

// ═══ 시계 & 페이즈 ═══
function updateClock(){
  var et  = new Date(new Date().toLocaleString('en-US',{timeZone:'America/New_York'}));
  var kst = new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Seoul'}));
  var h=et.getHours(), m=et.getMinutes(), s=et.getSeconds();
  var hm=h*100+m;
  var pad=n=>String(n).padStart(2,'0');
  document.getElementById('clockET').textContent = pad(h)+':'+pad(m)+':'+pad(s)+' ET';
  document.getElementById('clockKST').textContent = pad(kst.getHours())+':'+pad(kst.getMinutes())+' KST';
  var phase=hm>=400&&hm<930?'프리마켓':hm>=930&&hm<1000?'개장 30분':hm>=1000&&hm<1600?'장중':'장외';
  document.getElementById('phaseLabel').textContent = phase;
  document.getElementById('phaseSection').textContent = phase+' 스캔 결과';
}

// ═══ Claude AI 분석 ═══
async function runScan(){
  var raw     = document.getElementById('tickerInput').value.trim().toUpperCase();
  if(!raw){ document.getElementById('tickerInput').focus(); return; }
  var tickers = raw.split(/[\s,]+/).filter(t=>t.length>0).slice(0,5); // 최대 5개
  if(!tickers.length) return;
  if(tickers.length > 1){
    document.getElementById('tickerInput').value = '';
    for(var t of tickers){ await runScanSingle(t); }
    return;
  }
  var ticker = tickers[0];

  var apiKey = localStorage.getItem('apexKey')||'';
  if(!apiKey){
    showToast('설정에서 Claude API Key를 입력해주세요');
    switchTab('settings', document.querySelectorAll('.tab')[2]);
    return;
  }

  document.getElementById('scanBtn').disabled = true;
  document.getElementById('tickerInput').value = '';

  // 분석 중 표시
  document.getElementById('analyzeArea').innerHTML = `
    <div class="analyzing-card">
      <div class="analyzing-spinner"></div>
      <div>
        <div class="analyzing-ticker">${ticker}</div>
        <div class="analyzing-text">신호 분석 중...<br>차트 구조 · 뉴스 · 덤프 필터</div>
      </div>
    </div>`;

  var minGap   = parseInt(document.getElementById('minGap').textContent) || 20;
  var maxFloat = parseInt(document.getElementById('maxFloat').textContent) || 20;
  var minScore = parseInt(document.getElementById('minScore').textContent) || 70;

  var prompt = makePrompt(ticker, minGap, maxFloat);

  try {
    var res = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-api-key': apiKey,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body: JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:1000,
        messages:[{role:'user',content:prompt}]
      })
    });
    var data = await res.json();
    if(data.error) throw new Error(data.error.message);
    var text  = data.content[0].text.trim().replace(/```json|```/g,'').trim();
    var result = JSON.parse(text);
    handleResult(result);
  } catch(e){
    document.getElementById('analyzeArea').innerHTML = `
      <div class="alert-card" style="margin:4px 16px 10px">
        <div class="alert-msg" style="color:var(--r)">오류: ${e.message}</div>
      </div>`;
  }
  document.getElementById('scanBtn').disabled = false;
}


function makePrompt(ticker, minGap, maxFloat){
  return `당신은 프리마켓 급등주 전문 트레이딩 AI입니다. 테스트 모드입니다 (실거래 없음, 알람 전용).

종목: ${ticker}

다음 기준으로 신호를 분석하고 반드시 순수 JSON만 반환하세요 (마크다운, 설명 없음):

{
  "ticker": "${ticker}",
  "action": "ENTER" | "WATCH" | "BLOCK",
  "score": 0-100,
  "price": 현재 예상 주가 (실제 모를 경우 null),
  "gap_pct": 프리마켓 갭업 % (모를 경우 null),
  "float_m": Float 백만주 단위 (모를 경우 null),
  "short_pct": 공매도 비율 0-100 (모를 경우 null),
  "rvol": Relative Volume 배수 (모를 경우 null),
  "entry": 진입 권장가 (null 가능),
  "stop": 손절가 (null 가능),
  "target1": 1차 목표가 (null 가능),
  "rr": 손익비 (null 가능),
  "news": "최근 주요 뉴스 한 줄",
  "news_quality": "factual" | "vague" | "none",
  "signals": ["긍정 신호들"],
  "warnings": ["경고 사항들"],
  "blockers": ["차단 이유 (BLOCK인 경우)"],
  "summary": "한 줄 판단"
}

점수 기준:
- Float 5M 이하 +25점, 10M 이하 +20점, 20M 이하 +12점
- FDA/실적/M&A/계약 뉴스 +25점, 모호한 테마 +8점, 없음 0점
- RVol 15x+ +20점, 8x+ +15점, 4x+ +8점
- 갭업 50%+ +15점, 30%+ +12점, 20%+ +8점
- Short Interest 25%+ +10점, 15%+ +6점
- Higher Low 확인 +8점, 거래량 지속 +7점

BLOCK 조건 (하나라도 해당):
- OTC/핑크시트 종목
- 주가 $1 미만 또는 $20 초과
- Float ${maxFloat}M 초과
- 갭업 ${minGap}% 미만
- 뉴스 없음/펌프앤덤프성
- 리버스 스플릿 180일 이내
- Open = High 패턴
- Lower High 연속 2회+
- 거래량 소멸

ENTER: 점수 75+  WATCH: 55-74  BLOCK: 조건 해당`;
}
async function runScanSingle(ticker){
  var apiKey = localStorage.getItem('apexKey')||'';
  if(!apiKey) return;
  var minGap=parseInt(document.getElementById('minGap').textContent)||20;
  var maxFloat=parseInt(document.getElementById('maxFloat').textContent)||20;
  var minScore=parseInt(document.getElementById('minScore').textContent)||70;
  // 기존 runScan 로직 재사용
  document.getElementById('tickerInput').value = '';
  document.getElementById('scanBtn').disabled = true;
  document.getElementById('analyzeArea').innerHTML = `
    <div class="analyzing-card">
      <div class="analyzing-spinner"></div>
      <div><div class="analyzing-ticker">${ticker}</div><div class="analyzing-text">분석 중...</div></div>
    </div>`;
  var prompt = makePrompt(ticker, minGap, maxFloat);
  try{
    var res = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,messages:[{role:'user',content:prompt}]})
    });
    var data=await res.json();
    if(data.error) throw new Error(data.error.message);
    var result=JSON.parse(data.content[0].text.trim().replace(/```json|```/g,'').trim());
    handleResult(result);
  }catch(e){
    document.getElementById('analyzeArea').innerHTML=`<div class="alert-card" style="margin:4px 16px 10px"><div class="alert-msg" style="color:var(--r)">${ticker} 오류: ${e.message}</div></div>`;
  }
  document.getElementById('scanBtn').disabled=false;
}

function handleResult(r){
  document.getElementById('analyzeArea').innerHTML = '';

  // 카드에 추가 (날짜 태깅)
  r._date = new Date().toLocaleDateString('ko-KR');
  r._ts   = Date.now();
  // 같은 티커 기존꺼 제거 후 재추가 (최신 분석으로 교체)
  G.cards = G.cards.filter(c => c.ticker !== r.ticker);
  G.cards.push(r);
  G.cards = G.cards.slice(-30);
  localStorage.setItem('apexCards', JSON.stringify(G.cards));
  renderCards();

  // 알림 발송
  var minScore = parseInt(document.getElementById('minScore').textContent)||70;
  if(r.action==='ENTER' && r.score>=minScore){
    fireAlert(r,'ENTER');
    playBeep(true);
  } else if(r.action==='BLOCK'){
    if(document.getElementById('tgBlock').classList.contains('on')){
      fireAlert(r,'BLOCK');
    }
  } else if(r.action==='WATCH'){
    fireAlert(r,'WATCH');
  }

  // 모의 PnL 업데이트
  updatePnl(r);
}

// ═══ 카드 렌더 ═══
function setSortMode(mode){
  G.sortMode = mode;
  document.getElementById('btnScore').style.background = mode==='score'?'rgba(0,240,122,.12)':'none';
  document.getElementById('btnScore').style.color      = mode==='score'?'var(--g)':'var(--t3)';
  document.getElementById('btnScore').style.borderColor= mode==='score'?'rgba(0,240,122,.2)':'var(--b)';
  document.getElementById('btnTime').style.background  = mode==='time'?'rgba(0,240,122,.12)':'none';
  document.getElementById('btnTime').style.color       = mode==='time'?'var(--g)':'var(--t3)';
  document.getElementById('btnTime').style.borderColor = mode==='time'?'rgba(0,240,122,.2)':'var(--b)';
  renderCards();
}

function clearToday(){
  var today = new Date().toLocaleDateString('ko-KR');
  G.cards = G.cards.filter(c => c._date !== today);
  localStorage.setItem('apexCards', JSON.stringify(G.cards));
  renderCards();
}

function renderCards(){
  var el    = document.getElementById('cardsList');
  var today = new Date().toLocaleDateString('ko-KR');

  // 오늘 날짜 필터
  var todayCards = G.cards.filter(c => !c._date || c._date === today);

  // 정렬
  if(G.sortMode === 'score'){
    todayCards.sort((a,b) => (b.score||0) - (a.score||0));
  } else {
    todayCards.sort((a,b) => (b._ts||0) - (a._ts||0));
  }

  // 통계 바 업데이트
  var enter = todayCards.filter(c=>c.action==='ENTER').length;
  var watch = todayCards.filter(c=>c.action==='WATCH').length;
  var block = todayCards.filter(c=>c.action==='BLOCK').length;
  var statsEl = document.getElementById('statsText');
  if(statsEl) statsEl.textContent = '오늘 '+todayCards.length+'개  ·  ENTER '+enter+'  WATCH '+watch+'  BLOCK '+block;

  if(!todayCards.length){
    el.innerHTML = '<div class="empty-state"><div class="es-icon">⬡</div>오늘 분석한 종목 없음<br>티커를 입력해서 분석하세요</div>';
    return;
  }
  el.innerHTML = todayCards.map(r => cardHTML(r)).join('');
}

function cardHTML(r){
  var ac   = r.action||'WATCH';
  var abC  = {'ENTER':'ab-enter','WATCH':'ab-watch','BLOCK':'ab-block'}[ac];
  var cardC= {'ENTER':'enter','WATCH':'watch','BLOCK':'block'}[ac];
  var acColor = {'ENTER':'var(--g)','WATCH':'var(--a)','BLOCK':'var(--r)'}[ac];

  var tags = '';
  if(r.news_quality==='factual') tags+='<span class="tag tg">팩트뉴스</span>';
  if(r.float_m && r.float_m<10)  tags+='<span class="tag tg">Low Float</span>';
  if(r.short_pct && r.short_pct>20) tags+='<span class="tag tr">SI '+r.short_pct+'%</span>';
  if(r.rvol && r.rvol>8)         tags+='<span class="tag tb">RVol '+r.rvol+'x</span>';
  if(r.action==='BLOCK')         tags+='<span class="tag tr">BLOCK</span>';

  var sigs = '';
  if(r.signals && r.signals.length){
    sigs = '<div class="card-signals">'
      + r.signals.slice(0,3).map(s=>`<div class="sig-line"><span class="sig-icon" style="color:var(--g)">✓</span>${s}</div>`).join('')
      + r.warnings?.slice(0,2).map(w=>`<div class="sig-line"><span class="sig-icon" style="color:var(--a)">⚠</span>${w}</div>`).join('')
      + r.blockers?.slice(0,2).map(b=>`<div class="sig-line"><span class="sig-icon" style="color:var(--r)">✗</span>${b}</div>`).join('')
      + '</div>';
  }

  var price = r.price ? '$'+r.price.toFixed(2) : '--';
  var gap   = r.gap_pct ? '+'+r.gap_pct.toFixed(0)+'%' : '--';

  return `<div class="stock-card ${cardC}">
    <div class="card-row1">
      <div>
        <div class="card-ticker">${r.ticker}</div>
        <div class="card-sub">${r.float_m ? r.float_m+'M float · ' : ''}${r.news_quality||'--'}</div>
      </div>
      <div class="action-badge ${abC}">
        <div class="ab-score">${r.score}</div>
        <div class="ab-label">${ac}</div>
      </div>
    </div>
    <div class="card-row2">
      <span class="card-price">${price}</span>
      <span class="card-gap ${r.gap_pct<0?'red':''}">${gap}</span>
      ${r.rvol?`<span class="card-rvol">RVol ${r.rvol}x</span>`:''}
    </div>
    ${tags?`<div class="card-tags">${tags}</div>`:''}
    ${r.news?`<div class="news-line">${r.news}</div>`:''}
    ${(r.entry||r.stop||r.target1||r.rr)?`
    <div class="levels">
      <div class="lv lv-entry"><div class="lv-label">진입</div><div class="lv-val">${r.entry?'$'+r.entry:'--'}</div></div>
      <div class="lv lv-stop"><div class="lv-label">손절</div><div class="lv-val">${r.stop?'$'+r.stop:'--'}</div></div>
      <div class="lv lv-t1"><div class="lv-label">1차목표</div><div class="lv-val">${r.target1?'$'+r.target1:'--'}</div></div>
      <div class="lv lv-rr"><div class="lv-label">손익비</div><div class="lv-val">${r.rr?r.rr+'R':'--'}</div></div>
    </div>`:''}
    <div style="font-size:11px;color:var(--t2);margin-top:10px">${r.summary||''}</div>
    ${sigs}
  </div>`;
}

// ═══ 알림 ═══
function fireAlert(r, type){
  var time = new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
  var alert = { ticker:r.ticker, type, score:r.score, time,
    msg: type==='ENTER'
      ? `점수 ${r.score}pt · ${r.news||''}`
      : type==='BLOCK'
      ? (r.blockers||[]).join(' | ')
      : `관심 후보 · 점수 ${r.score}pt`,
    detail: r.entry ? `진입 $${r.entry}  손절 $${r.stop}  목표 $${r.target1}` : ''
  };

  G.alerts.unshift(alert);
  G.alerts = G.alerts.slice(0,50);
  G.unread++;
  localStorage.setItem('apexAlerts', JSON.stringify(G.alerts));
  updateBadge();

  // 브라우저 알림
  if(Notification.permission==='granted'){
    new Notification(`RECON ${r.ticker}`, {
      body: alert.msg + (alert.detail?'\n'+alert.detail:'')
    });
  }

  // ntfy
  var ch = localStorage.getItem('ntfyCh')||'';
  if(ch) sendNtfy(ch, r.ticker, type, alert.msg+(alert.detail?'\n'+alert.detail:''));
}

function renderAlerts(){
  var el = document.getElementById('alertsList');
  if(!G.alerts.length){
    el.innerHTML = '<div class="empty-state"><div class="es-icon">◎</div>알림 없음<br>신호 발생 시 여기에 기록됩니다</div>';
    return;
  }
  el.innerHTML = G.alerts.slice(0,30).map(a=>`
    <div class="alert-card alert-${a.type.toLowerCase()}">
      <div class="alert-hdr">
        <span class="alert-ticker">${a.ticker}</span>
        <span class="alert-time">${a.time}</span>
      </div>
      <div class="alert-msg">${a.msg}</div>
      ${a.detail?`<div class="alert-msg" style="margin-top:3px;font-family:var(--mono);font-size:11px">${a.detail}</div>`:''}
      <div class="alert-action aa-${a.type.toLowerCase()}">${
        a.type==='ENTER'?'→ ENTER 신호':
        a.type==='BLOCK'?'→ 진입 금지':
        a.type==='EXIT' ?'→ 매도 신호':
        '→ 관심 후보'
      }</div>
    </div>`).join('');
}

function updateBadge(){
  var dot = document.getElementById('notifDot');
  dot.style.display = G.unread>0 ? 'block' : 'none';
}

function clearAlerts(){
  G.alerts=[]; G.unread=0;
  localStorage.removeItem('apexAlerts');
  updateBadge(); renderAlerts();
}

// ═══ 모의 PnL ═══
function updatePnl(r){
  if(r.action!=='ENTER'||!r.entry||!r.target1) return;
  // 단순 시뮬: 목표1까지 도달했다고 가정 (33% 익절)
  var sim = (r.target1 - r.entry) / r.entry * 0.33 * 100;
  G.mockPnl += sim;
  localStorage.setItem('apexPnl', G.mockPnl.toFixed(2));
  renderPnl();
}

function renderPnl(){
  var pnl = G.mockPnl;
  if(Math.abs(pnl) < 0.01){ document.getElementById('pnlBar').innerHTML=''; return; }
  var c = pnl>0?'pnl-pos':pnl<0?'pnl-neg':'pnl-zero';
  var sign = pnl>0?'+':'';
  document.getElementById('pnlBar').innerHTML = `
    <div class="pnl-bar">
      <div class="pnl-label">모의 누적 수익률</div>
      <div class="pnl-val ${c}">${sign}${pnl.toFixed(1)}%</div>
    </div>`;
}

// ═══ ntfy ═══
async function testNtfy(){
  var ch = document.getElementById('ntfyCh').value.trim();
  if(!ch){ document.getElementById('ntfyStatus').textContent='채널명을 입력하세요'; return; }
  localStorage.setItem('ntfyCh', ch);
  document.getElementById('ntfyStatus').textContent = '전송 중...';
  await sendNtfy(ch,'TEST','ENTER','RECON 연결 테스트 ✓\n신호가 발생하면 이렇게 알림이 옵니다');
  document.getElementById('ntfyStatus').textContent = `✓ 전송 완료 — ntfy.sh/${ch}`;
}

async function sendNtfy(ch, ticker, type, msg){
  var prio = type==='ENTER'||type==='STOP'?'5':'3';
  var tags = type==='ENTER'?'rocket':type==='BLOCK'?'no_entry':'bell';
  try{
    await fetch(`https://ntfy.sh/${ch}`,{
      method:'POST',
      headers:{'Title':`RECON ${ticker}`,'Priority':prio,'Tags':tags,'Content-Type':'text/plain; charset=utf-8'},
      body: msg,
    });
  }catch(e){}
}

// ═══ 소리 ═══
function playBeep(success){
  try{
    var ctx = new(window.AudioContext||window.webkitAudioContext)();
    (success?[440,554,659,880]:[440,370,330]).forEach((f,i)=>{
      var o=ctx.createOscillator(), g=ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value=f; o.type='sine';
      var t=ctx.currentTime+i*.07;
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(.25,t+.02);
      g.gain.linearRampToValueAtTime(0,t+.13);
      o.start(t); o.stop(t+.13);
    });
  }catch(e){}
}

// ═══ 유틸 ═══
function save(k,v){ localStorage.setItem(k,v); if(k==='apexKey') G.apiKey=v; if(k==='ntfyCh') G.ntfy=v; }
function cycle(id,vals){
  var el=document.getElementById(id);
  var i=vals.indexOf(el.textContent);
  el.textContent=vals[(i+1)%vals.length];
}
function clearAll(){
  if(confirm('모든 데이터를 삭제할까요?')){
    ['apexCards','apexAlerts','apexPnl'].forEach(k=>localStorage.removeItem(k));
    G.cards=[]; G.alerts=[]; G.mockPnl=0; G.unread=0;
    renderCards(); renderAlerts(); updateBadge();
    document.getElementById('pnlBar').innerHTML='';
  }
}
function showToast(msg){
  var t=document.createElement('div');
  t.style.cssText='position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#1c2a38;color:#dde8f0;padding:10px 18px;border-radius:20px;font-size:13px;z-index:999;white-space:nowrap;border:1px solid #253646';
  t.textContent=msg; document.body.appendChild(t);
  setTimeout(()=>t.remove(),2500);
}

// 브라우저 알림 권한
if('Notification' in window && Notification.permission==='default'){
  Notification.requestPermission();
}

// 엔터키
document.getElementById('tickerInput').addEventListener('keydown',e=>{ if(e.key==='Enter') runScan(); });
document.getElementById('tickerInput').addEventListener('input',function(){ this.value=this.value.toUpperCase(); });

// 초기화
renderCards();
renderAlerts();
renderPnl();
updateBadge();
updateClock();
setInterval(updateClock,1000);
</script>
